name: RPSC Results Monitor

on:
  schedule:
    # Har 15 minute me chalega (UTC). GitHub kabhi-kabhi 5-15 min delay kar sakta hai.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

# state.json ko repo me wapas commit karne ke liye write permission
permissions:
  contents: write

# Ek waqt me sirf ek run (push collision se bachne ke liye)
concurrency:
  group: rpsc-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check RPSC results for updates
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          # RPSC blocks cloud IPs -> relay via reader from CI.
          RPSC_FORCE_PROXY: "1"
          # Sirf 09/10/2026 ke baad release hue results par alert.
          RPSC_MIN_DATE: "09/10/2026"
        run: python3 monitor.py

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "No state change to commit."
          else
            git commit -m "chore: update RPSC state [skip ci]"
            git push
          fi
